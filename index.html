<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <meta name="format-detection" content="telephone=no">
    <title>ملوك السعادة - الفخامة في الضيافة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=El+Messiri:wght@400;700&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,900;1,900&family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-gold: linear-gradient(135deg, #c5a059 0%, #f7e1a0 50%, #8b6914 100%);
            --deep-black: #050505;
        }
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background-color: var(--deep-black);
            color: #ffffff;
            scroll-behavior: smooth;
        }
        .font-header { font-family: 'Noto Sans Arabic', sans-serif; }
        .font-numbers { font-family: 'Montserrat', sans-serif; }
        
        .gold-shimmer {
            position: relative;
            overflow: hidden;
        }
        .gold-shimmer::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 55%
            );
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .nav-glass {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.15);
        }

        .card-shadow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-shadow:hover {
            box-shadow: 0 30px 60px -12px rgba(197, 160, 89, 0.1);
            transform: translateY(-10px);
        }

        input[type="range"]::-webkit-scrollbar {
            display: none;
        }
        
        .bg-royal-gold {
            background: var(--royal-gold);
        }
        
        .text-royal-gold {
            background: var(--royal-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="overflow-x-hidden selection:bg-[#c5a059] selection:text-black">
    <div class="grain-overlay"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
